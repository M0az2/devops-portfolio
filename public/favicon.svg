<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background -->
  <rect width="64" height="64" rx="14" fill="#080b12"/>

  <!-- Subtle border glow -->
  <rect width="64" height="64" rx="14" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25"/>

  <!-- Infinity / lemniscate path — DevOps loop symbol -->
  <!-- Left lobe (Dev - blue) -->
  <path
    d="M32 32 C32 22, 14 16, 10 26 C7 33, 14 42, 22 38 C27 36, 32 32, 32 32"
    stroke="#38bdf8"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
    opacity="0.95"
  />
  <!-- Right lobe (Ops - purple) -->
  <path
    d="M32 32 C32 22, 50 16, 54 26 C57 33, 50 42, 42 38 C37 36, 32 32, 32 32"
    stroke="#818cf8"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
    opacity="0.95"
  />

  <!-- Center dot -->
  <circle cx="32" cy="32" r="2.5" fill="#38bdf8"/>

  <!-- Left arrowhead on Dev lobe (top-left area) -->
  <path
    d="M14.5 19 L17.5 16 L17.5 22"
    stroke="#38bdf8"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Right arrowhead on Ops lobe (top-right area) -->
  <path
    d="M49.5 19 L46.5 16 L46.5 22"
    stroke="#818cf8"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
